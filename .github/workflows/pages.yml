name: Publish website
# Builds the SoundWell website and publishes it with GitHub Pages on every push to main (or by hand).
on:
  push:
    branches: [main]
    paths: [site/**, build/freesound.json, build/make-site.mjs, .github/workflows/pages.yml]
  workflow_dispatch:
  workflow_run:
    workflows: [Import Freesound recordings]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --no-warnings build/make-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
