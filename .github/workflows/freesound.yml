name: Import Freesound recordings
# Runs when build/freesound-queries.json changes, or by hand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      max_mb:
        description: Size budget for all recordings, in MB
        default: '940'
      max:
        description: Maximum number of recordings in the library
        default: '4000'
  push:
    branches: [main]
    paths: [build/freesound-queries.json]
permissions:
  contents: write
concurrency: freesound
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Fetch and process sounds
        env:
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          FREESOUND_MINUTES: '120'
          FREESOUND_MAX_MB: ${{ github.event.inputs.max_mb || '940' }}
        run: node --no-warnings build/fetch-freesound.mjs --max "${{ github.event.inputs.max || '4000' }}"
      - name: Turn long ambiences into seamless loops
        run: node --no-warnings build/loop-beds.mjs
      - name: Bundle recordings into sound packs
        run: node --no-warnings build/pack-sprites.mjs
      - name: Rebuild the page
        run: node build/build-page.cjs build site/index.html
      - name: Commit
        run: |
          git config user.name "soundwell-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/freesound.json build/sprites.json site/media site/index.html
          git diff --cached --quiet && echo "Nothing new" && exit 0
          git commit -m "Import Freesound CC0 recordings"
          git pull --rebase origin main
          git push origin HEAD:main
